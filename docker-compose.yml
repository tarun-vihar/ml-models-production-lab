services:
  kafka:
    image: apache/kafka:4.0.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build:
      context: .
      dockerfile: fraud-detection/Dockerfile
    ports: ["8080:8080"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud
      SPRING_DATASOURCE_USERNAME: fraud
      SPRING_DATASOURCE_PASSWORD: fraud
      SPRING_DATA_REDIS_HOST: redis
      FRAUD_RULES_HIGH_AMOUNT_THRESHOLD: 5000
      FRAUD_RULES_VELOCITY_THRESHOLD: 8
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
  fraud-scoring:
    build:
      context: ./fraud-scoring
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MSK_AUTH_MODE: none
      KAFKA_INPUT_TOPIC: enriched-transactions
      KAFKA_OUTPUT_TOPIC: scored-transactions
      KAFKA_DLQ_TOPIC: scoring-dead-letter-transactions
      KAFKA_CONSUMER_GROUP: fraud-scoring-v1
      MODEL_MODE: development-baseline
      MODEL_VERSION: development-baseline-v1
      MODEL_DIR: /models
      MODEL_FEATURE_MANIFEST: /models/feature-manifest.json
      METRICS_PORT: 8000
    volumes:
      - ${FRAUD_SCORING_MODEL_ARTIFACTS_DIR:-./fraud-scoring/artifacts}:/models:ro
    ports: ["8000:8000"]
    depends_on:
      kafka: {condition: service_healthy}
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
  fraud-graph:
    build:
      context: ./fraud-graph
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MSK_AUTH_MODE: none
      KAFKA_INPUT_TOPIC: scored-transactions
      KAFKA_OUTPUT_TOPIC: graph-scored-transactions
      KAFKA_DLQ_TOPIC: graph-dead-letter-transactions
      KAFKA_CONSUMER_GROUP: fraud-graph-v1
      GRAPH_MODE: mock
      NEPTUNE_ENDPOINT: ${NEPTUNE_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      NEPTUNE_AUTH_MODE: ${NEPTUNE_AUTH_MODE:-iam}
      GRAPH_SHARED_DEVICE_ACCOUNT_THRESHOLD: 3
      GRAPH_MEDIUM_THRESHOLD: 0.30
      GRAPH_HIGH_THRESHOLD: 0.70
      MAX_PROCESSING_ATTEMPTS: 3
      METRICS_PORT: 8001
    ports: ["8001:8001"]
    depends_on:
      kafka: {condition: service_healthy}
      fraud-scoring: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8001/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  kafka-data:
  redis-data:
  postgres-data:
